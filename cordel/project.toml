# CORDEL identity is separate from Ren'Py package and save-format versions.
schema_version = 1
name = "CORDEL ENGINE"
version = "0.1.0-dev"
display_name = "CORDEL ENGINE — 0.1.0-dev"
milestone = "Phase 1.3 — Narrative Ownership Experiment"
status = "narrative-ownership-fixture-software-verified"

[repository]
url = "https://github.com/mylife-as-miles/cordel-engine"
default_branch = "main"
history = "fresh-cordel-history"

[upstream]
repository = "https://github.com/renpy/renpy"
