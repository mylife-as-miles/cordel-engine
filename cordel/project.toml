branch_at_bootstrap = "master"
base_commit = "68fdaef917919e330c90765dd69668fee1cb9654"

[compatibility]
python = ">=3.12.8,<3.13"
preserve_renpy_namespace = true
cordel_runtime_implemented = false # Integrated production world/narrative runtime remains proposed.

[experiments]
viewport_reference = "examples/cordel_viewport"
report = "docs/cordel/PHASE_1_1_VIEWPORT.md"
